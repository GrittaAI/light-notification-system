<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff8f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a110e" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Pushup Nudge by Gritta AI: your tasks, with a WhatsApp nudge when they are due.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pushup Nudge">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pushup Nudge</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Loading veil (Pushup style): shown until the app has drawn its first screen, then lifts. -->
  <div id="splash" role="status" aria-live="polite" aria-label="Loading Pushup Nudge">
    <div class="sp-inner">
      <div class="sp-logo" aria-hidden="true">
        <svg class="sp-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
          <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
        </svg>
      </div>
      <div class="sp-mark">PUSHUP NUDGE</div>
      <div class="sp-by">by Gritta AI</div>
      <b class="sp-bar"><i></i></b>
    </div>
  </div>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div class="toast-stack">
    <div id="alerts" class="toasts" role="alert"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  </div>
  <noscript><p class="boot">Pushup Nudge needs JavaScript.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
