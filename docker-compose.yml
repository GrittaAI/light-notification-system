services:
  waha:
    # Pinned. GOWS engine (no embedded browser). The default is the amd64 image.
    # On ARM (Apple Silicon Mac, ARM servers) set
    # WAHA_IMAGE=devlikeapro/waha:gows-arm-2026.10.1 in .env. Upgrade both tags
    # together and deliberately; unplanned WAHA upgrades can break sending.
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows-2026.10.1}
    restart: unless-stopped
    # Localhost only: dashboard/QR page and API must not be public.
    # On a server, reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:3000:3000"
    # Explicit list (not env_file) so Google/SMTP secrets stay out of this container.
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?set WAHA_API_KEY in .env}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD in .env}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?set WAHA_DASHBOARD_PASSWORD in .env}
      # The WAHA docs say the global default engine is WEBJS unless this is set.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      # Bring sessions back after a container restart (no QR re-scan).
      WAHA_WORKER_RESTART_SESSIONS: "True"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-sessions:/app/.sessions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned: a stray SERVICE_ROLE in the shared .env must never turn off call reminders.
      SERVICE_ROLE: reminders
      # Overrides WAHA_URL from .env: use the compose network.
      WAHA_URL: http://waha:3000
      # Overrides GOOGLE_SERVICE_ACCOUNT_KEY_FILE from .env: the key mounted below.
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/google-service-account.json
      # Admin UI: listens on all interfaces inside the container; published on host localhost only below.
      ADMIN_PORT: "8081"
      ADMIN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8081"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
      - app-data:/app/data
    depends_on:
      - waha
    # Health endpoint (not published). Healthy = last full sync < 10 min old and WAHA session WORKING.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.HEALTH_PORT || 8080) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Nudge: the tasks product (nudge.grittaai.com). Same image and database as `app`, its own process:
  # a crash or restart here cannot stop call reminders. No Google key needed.
  nudge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: tasks
      # Overrides WAHA_URL from .env: use the compose network.
      WAHA_URL: http://waha:3000
      # Listens on all interfaces inside the container; published on host localhost only below.
      TASKS_PORT: "8082"
      TASKS_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${TASKS_PORT:-8082}:8082"
    volumes:
      - app-data:/app/data
    depends_on:
      - waha
    # Nudge's own health endpoint (not published). Healthy = WAHA session WORKING and the nudge job ran in the last 5 min.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.TASKS_HEALTH_PORT || 8083) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  waha-sessions:
  app-data:
